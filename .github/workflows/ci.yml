name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: 质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装锁定依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 静态检查
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build
